plugins {
    id 'com.android.application'
}

def popularitySource = rootProject.file('shared/data/popularity.inc')
def popularityJavaDir = layout.buildDirectory.dir('generated/sources/popularity/java')

android {
    namespace 'com.flynes.emu'
    compileSdk 36

    defaultConfig {
        applicationId "com.flynes.emu"
        minSdk 24
        targetSdk 36
        versionCode 1007016
        versionName "1.7.16"
        testInstrumentationRunner "com.flynes.emu.test.SingleDeviceCertificationRunner"
        ndk {
            abiFilters 'arm64-v8a', 'x86_64'
        }
        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17 -fvisibility=hidden'
                arguments '-DNES_CORE_DIR=' + project.rootDir.getAbsolutePath() + '/core',
                        '-DFLYNES_SHARED_DIR=' + project.rootDir.getAbsolutePath() + '/shared',
                        '-DANDROID_STL=c++_shared'
            }
        }
    }

    buildFeatures {
        prefab true
    }

    buildTypes {
        debug {
            pseudoLocalesEnabled true
        }
        release {
            minifyEnabled false
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    ndkVersion '27.0.12077973'

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main.assets.srcDir rootProject.file('content/assets')
        main.java.srcDir popularityJavaDir
        test.resources.srcDir rootProject.file('shared/tests/fixtures')
        androidTest.assets.srcDir rootProject.file('shared/data')
        androidTest.jniLibs.srcDir layout.buildDirectory.dir('generated/cryptoTestJniLibs')
    }
}

dependencies {
    implementation 'androidx.games:games-frame-pacing:2.1.3'
    implementation 'androidx.activity:activity:1.13.0'
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'com.google.zxing:core:3.5.4'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    androidTestImplementation 'androidx.test:core:1.7.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test:rules:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    androidTestImplementation 'androidx.test.espresso:espresso-contrib:3.7.0'
}

// Compile the same curated ranking table consumed directly by the shared C++ product layer.
def generatePopularity = tasks.register('generatePopularity') {
    inputs.file(popularitySource)
    outputs.dir(popularityJavaDir)
    doLast {
        def rows = popularitySource.readLines('UTF-8').findAll {
            it.startsWith('FLYNES_POPULARITY_RANK(')
        }.collect { it.replace('FLYNES_POPULARITY_RANK(', 'new Popularity.Rank(') + ',' }
        if (rows.isEmpty()) throw new GradleException('Popularity table is empty')
        def target = new File(popularityJavaDir.get().asFile, 'com/flynes/emu/PopularityRanks.java')
        target.parentFile.mkdirs()
        target.setText('package com.flynes.emu;\n' +
                '// Generated from shared/data/popularity.inc; do not edit.\n' +
                'final class PopularityRanks {\n' +
                'static final Popularity.Rank[] RANKS = {\n' + rows.join('\n') + '\n};\n}\n', 'UTF-8')
    }
}
tasks.named('preBuild').configure { dependsOn(generatePopularity) }

// Same-source independent native test artifact. It is packaged only in the
// instrumentation APK and is rebuilt from declared inputs before test packaging.
def cryptoTestSource = file('src/androidTest/cpp')
def cryptoWindows = System.getProperty('os.name').toLowerCase().contains('windows')
def cryptoCmakeBin = new File(android.sdkDirectory, 'cmake/3.22.1/bin')
def cryptoCmake = new File(cryptoCmakeBin, cryptoWindows ? 'cmake.exe' : 'cmake')
def cryptoNinja = new File(cryptoCmakeBin, cryptoWindows ? 'ninja.exe' : 'ninja')
def cryptoToolchain = new File(android.sdkDirectory,
        "ndk/${android.ndkVersion}/build/cmake/android.toolchain.cmake")
def cryptoTestInputs = files(fileTree('src/androidTest/cpp'),
        fileTree('src/main/cpp/nearby') { include 'crypto_port.*', 'crypto_jni.*', 'secret_registry.*' },
        rootProject.file('shared/CMakeLists.txt'),
        fileTree(rootProject.file('shared/nearby-quic-provider/src')),
        rootProject.file('shared/nearby-quic-provider/Cargo.toml'),
        rootProject.file('shared/nearby-quic-provider/Cargo.lock'),
        fileTree(rootProject.file('shared/include')),
        fileTree(rootProject.file('shared/src/session')),
        fileTree(new File(cryptoToolchain.parentFile, '.')),
        cryptoCmake, cryptoNinja)
['x86_64', 'arm64-v8a'].each { testAbi ->
def cryptoTestBuild = layout.buildDirectory.dir("intermediates/cryptoTestNative/${testAbi}")
def cryptoTestOutput = layout.buildDirectory.dir("generated/cryptoTestJniLibs/${testAbi}")
def taskSuffix = testAbi.replaceAll('[^A-Za-z0-9]', '')
def configureCryptoTest = tasks.register("configureNearbyCryptoTestNative${taskSuffix}", Exec) {
    inputs.files(cryptoTestInputs)
    inputs.property('ndkVersion', android.ndkVersion)
    inputs.property('abi', testAbi)
    inputs.property('androidApi', 24)
    inputs.property('stl', 'c++_static')
    outputs.file(cryptoTestBuild.map { it.file('CMakeCache.txt') })
    commandLine cryptoCmake.absolutePath, '-S', cryptoTestSource.absolutePath,
            '-B', cryptoTestBuild.get().asFile.absolutePath, '-G', 'Ninja',
            '-DCMAKE_MAKE_PROGRAM=' + cryptoNinja.absolutePath,
            '-DCMAKE_TOOLCHAIN_FILE=' + cryptoToolchain.absolutePath,
            "-DANDROID_ABI=${testAbi}", '-DANDROID_PLATFORM=android-24',
            '-DANDROID_STL=c++_static', '-DCMAKE_BUILD_TYPE=Debug',
            '-DCMAKE_LIBRARY_OUTPUT_DIRECTORY=' + cryptoTestOutput.get().asFile.absolutePath
}
def buildCryptoTest = tasks.register("buildNearbyCryptoTestNative${taskSuffix}", Exec) {
    dependsOn configureCryptoTest
    inputs.files(cryptoTestInputs)
    inputs.property('ndkVersion', android.ndkVersion)
    inputs.property('abi', testAbi)
    inputs.property('androidApi', 24)
    inputs.property('stl', 'c++_static')
    outputs.file(cryptoTestOutput.map { it.file('libnearby_crypto_test.so') })
    commandLine cryptoCmake.absolutePath, '--build', cryptoTestBuild.get().asFile.absolutePath,
            '--target', 'nearby_crypto_test', '--parallel', '4'
}
tasks.configureEach { candidate ->
    if (candidate.name == 'preDebugAndroidTestBuild' ||
            candidate.name == 'mergeDebugAndroidTestJniLibFolders') candidate.dependsOn buildCryptoTest
}

}
