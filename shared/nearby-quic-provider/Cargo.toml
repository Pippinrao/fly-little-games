[package]
name = "flynes-nearby-quic-provider"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[lib]
crate-type = ["rlib", "staticlib"]

[dependencies]
bytes = "=1.12.1"
quinn = { version = "=0.11.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
ring = "=0.17.14"
rustls = { version = "=0.23.43", default-features = false, features = ["ring", "std"] }
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "net", "time", "io-util", "sync"] }
x509-parser = "=0.18.1"

[dev-dependencies]
rcgen = { version = "=0.14.10", default-features = false, features = ["crypto", "ring"] }
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread", "net", "time", "io-util", "sync"] }
