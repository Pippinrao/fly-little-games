plugins {
    id 'com.android.application'
}

android {
    namespace 'com.flynes.emu'
    compileSdk 36

    defaultConfig {
        applicationId "com.flynes.emu"
        minSdk 24
        targetSdk 36
        versionCode 1001003
        versionName "1.1.3"
        testInstrumentationRunner "com.flynes.emu.test.SingleDeviceCertificationRunner"
        ndk {
            abiFilters 'arm64-v8a', 'x86_64'
        }
        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17 -fvisibility=hidden'
                arguments '-DNES_CORE_DIR=' + project.rootDir.getAbsolutePath() + '/core',
                        '-DFLYNES_SHARED_DIR=' + project.rootDir.getAbsolutePath() + '/shared',
                        '-DANDROID_STL=c++_shared'
            }
        }
    }

    buildFeatures {
        prefab true
    }

    buildTypes {
        debug {
            pseudoLocalesEnabled true
        }
        release {
            minifyEnabled false
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    ndkVersion '27.0.12077973'

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        test.resources.srcDir rootProject.file('shared/tests/fixtures')
    }
}

dependencies {
    implementation 'androidx.games:games-frame-pacing:2.1.3'
    implementation 'androidx.activity:activity:1.13.0'
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'com.google.android.material:material:1.14.0'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:core:1.7.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test:rules:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    androidTestImplementation 'androidx.test.espresso:espresso-contrib:3.7.0'
}
